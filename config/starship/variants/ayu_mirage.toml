"$schema" = 'https://starship.rs/config-schema.json'

# variant: ayu_mirage. managed by `spv` in fish config.fish
add_newline = true
palette = 'ayu_mirage'

# line 1: who/where/git. right side lives in fish's right prompt so it
# never overflows; fish hides it when the line gets too long
format = """
$os$username$hostname\
$directory\
$git_branch$git_status$git_state$git_metrics\
$line_break\
$character"""

right_format = """
$python$golang$rust$nodejs$bun$c\
${custom.tuios_agents}${custom.tuios}${custom.tuios_here}\
$docker_context$jobs$cmd_duration$status$time"""

[os]
disabled = false
style = "fg:ink bg:user"
format = '[](fg:user)[$symbol ]($style)'

[os.symbols]
Macos = "󰀵"
Linux = "󰌽"

[username]
show_always = true
style_user = "fg:ink bg:user bold"
style_root = "fg:ink bg:user bold"
format = '[$user]($style)[ ](fg:user)'

# only shows over ssh, needs starship + this file on the server
[hostname]
ssh_only = true
ssh_symbol = " "
format = '[](fg:err)[$ssh_symbol$hostname](fg:ink bg:err)[](fg:err) '

# full path, no truncation
[directory]
truncation_length = 100
truncate_to_repo = false
read_only = " 󰌾"
format = '[](fg:path)[$path$read_only](fg:ink bg:path)[](fg:path) '

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
".config" = " "

[git_branch]
symbol = ""
format = '[](fg:git)[$symbol $branch](fg:ink bg:git)'

[git_status]
format = '([ $all_status$ahead_behind](fg:ink bg:git))[ ](fg:git)'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
stashed = " ${count}"
modified = " ${count}"
staged = " ${count}"
untracked = " ?${count}"
deleted = " ${count}"
renamed = " ${count}"
conflicted = " ${count}"

[git_state]
format = '[](fg:err)[$state( $progress_current/$progress_total)](fg:ink bg:err)[](fg:err) '

[git_metrics]
disabled = false
added_style = "fg:user bg:surface"
deleted_style = "fg:err bg:surface"
format = '([](fg:surface)([+$added]($added_style))([ -$deleted]($deleted_style))[](fg:surface))'

[python]
symbol = ""
format = '[](fg:lang)[$symbol( $version)( (#$virtualenv))](fg:ink bg:lang)[](fg:lang) '

[golang]
symbol = ""
format = '[](fg:lang)[$symbol( $version)](fg:ink bg:lang)[](fg:lang) '

[rust]
symbol = ""
format = '[](fg:lang)[$symbol( $version)](fg:ink bg:lang)[](fg:lang) '

[nodejs]
symbol = ""
format = '[](fg:lang)[$symbol( $version)](fg:ink bg:lang)[](fg:lang) '

[bun]
symbol = ""
format = '[](fg:lang)[$symbol( $version)](fg:ink bg:lang)[](fg:lang) '

[c]
symbol = ""
format = '[](fg:lang)[$symbol( $version)](fg:ink bg:lang)[](fg:lang) '

# live tuios sessions, hidden when the daemon is down or empty
[custom.tuios]
command = 'tuios ls --json 2>/dev/null | jq -r "[.[] | select(.saved | not)] | if length > 0 then (length | tostring) + (if any(.attached) then \"\" else \" detached\" end) else empty end"'
when = 'test -z "$TUIOS_PANE_ID$TUIOS_SESSION"'
shell = ["sh"]
symbol = "tuios"
format = '([](fg:tuios)[$symbol $output](fg:ink bg:tuios)[](fg:tuios) )'

# inside tuios: which session/workspace this pane is in
[custom.tuios_here]
command = 'tuios session-info -s "$TUIOS_SESSION" --json 2>/dev/null | jq -r --arg s "$TUIOS_SESSION" "\$s + \" \" + (.current_workspace|tostring) + \"/\" + (.num_workspaces|tostring)"'
when = 'test -n "$TUIOS_SESSION"'
shell = ["sh"]
symbol = "tuios"
format = '([](fg:tuios)[$symbol $output](fg:ink bg:tuios)[](fg:tuios) )'

# any shell: agents across all sessions that need you, finished unseen, or left you a message.
# prints nothing (so no pill) when everything is quiet
[custom.tuios_agents]
command = 'tuios list-agents --json --all-sessions 2>/dev/null | jq -r "(.agents // []) as \$a | [([\$a[] | select(.needs_you)] | length | select(. > 0) | \"\(.) waiting\"), ([\$a[] | select(.finished_unread)] | length | select(. > 0) | \"\(.) done\"), ((.human_unread // 0) | select(. > 0) | \"\(.) msg\")] | if length > 0 then join(\" \") else empty end"'
when = true
shell = ["sh"]
symbol = "󰚩"
format = '([](fg:err)[$symbol $output](fg:ink bg:err)[](fg:err) )'

[docker_context]
symbol = ""
format = '[](fg:lang)[$symbol $context](fg:ink bg:lang)[](fg:lang) '

[jobs]
symbol = ""
format = '[](fg:surface)[$symbol $number](fg:text bg:surface)[](fg:surface) '

# only shows for slow commands; kitty handles finish notifications
[cmd_duration]
min_time = 2000
format = '[](fg:surface)[󰥔 $duration](fg:text bg:surface)[](fg:surface) '
show_notifications = false

[status]
disabled = false
symbol = ""
format = '[](fg:err)[$symbol $status](fg:ink bg:err)[](fg:err) '

[time]
disabled = false
time_format = "%R"
format = '[](fg:surface)[ $time](fg:text bg:surface)[](fg:surface)'

[line_break]
disabled = false

[character]
success_symbol = '[❯](bold fg:user)'
error_symbol = '[❯](bold fg:err)'
vimcmd_symbol = '[❮](bold fg:user)'
vimcmd_replace_one_symbol = '[❮](bold fg:tuios)'
vimcmd_replace_symbol = '[❮](bold fg:tuios)'
vimcmd_visual_symbol = '[❮](bold fg:git)'

